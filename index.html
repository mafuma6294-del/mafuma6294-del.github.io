<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="自動記帳 Drive連携の概要">
  <title>{{アプリ名}} - ホーム</title>
  <style>
    :root { color-scheme: light; --ink:#1d2939; --muted:#475467; --accent:#185abc; --line:#d0d5dd; --surface:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--surface); line-height:1.75; }
    main { width:min(100% - 2rem, 48rem); margin:clamp(2rem,8vw,5rem) auto; padding:clamp(1.25rem,5vw,3rem); background:#fff; border:1px solid var(--line); border-radius:1rem; }
    h1 { line-height:1.3; font-size:clamp(1.8rem,5vw,2.5rem); }
    h2 { margin-top:2rem; font-size:1.2rem; }
    p { color:var(--muted); }
    a { color:var(--accent); }
    footer { margin-top:2.5rem; padding-top:1rem; border-top:1px solid var(--line); color:var(--muted); font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>{{アプリ名}}</h1>
    <p>個人が自分の業務記録の自動化に使う、本人専用の私的ツールです。一般公開や第三者への提供は行いません。</p>
    <h2>Google Drive の利用</h2>
    <p>本人が指定したバックアップ用フォルダ内にあるファイルやフォルダのメタデータを読み取り、本人が作成したバックアップの整理状態を確認します。Google Drive へのアクセス権限は読み取り専用（drive.readonly）です。ファイルの中身は取得しません。</p>
    <h2>プライバシー</h2>
    <p>取得する情報の範囲、利用目的、保存方法などは<a href="privacy.html">プライバシーポリシー</a>をご確認ください。</p>
    <footer>最終更新日：2026年10月8日</footer>
  </main>
</body>
</html>
